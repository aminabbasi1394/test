<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>روم آنلاین</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #10131c;
      color: white;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px;
      background: #5865f2;
      color: white;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #34394b;
      border-radius: 10px;
      outline: none;
      background: #191e2b;
      color: white;
      margin-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }

    .screen {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 20px;
    }

    #login {
      padding-top: 70px;
    }

    .card {
      background: #191e2b;
      border: 1px solid #303649;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 35px #0004;
    }

    h1,
    h2 {
      text-align: center;
      margin-top: 0;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      color: #ffcc66;
      font-size: 13px;
      line-height: 1.8;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #191e2b;
      border: 1px solid #303649;
      padding: 13px;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .room-title {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .leave {
      background: #e5484d;
      padding: 8px 12px;
      white-space: nowrap;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      align-items: flex-start;
    }

    .tab-group {
      flex: 1;
      min-width: 0;
    }

    .tab {
      width: 100%;
      background: #292f42;
    }

    .panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      padding: 0 12px;
      margin-top: 5px;
      background: #191e2b;
      border-radius: 10px;
      transition: 0.25s;
    }

    .panel.open {
      max-height: 300px;
      opacity: 1;
      padding: 12px;
      overflow-y: auto;
    }

    .player {
      padding: 9px;
      background: #292f42;
      border-radius: 8px;
      margin-bottom: 7px;
      font-size: 13px;
    }

    .host {
      color: #ffd45c;
    }

    #consoleLog {
      font-size: 12px;
      color: #aeb7d0;
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
    }

    #messages {
      height: 390px;
      overflow-y: auto;
      background: #0d1018;
      border: 1px solid #303649;
      border-radius: 14px;
      padding: 12px;
    }

    .message {
      background: #252b3b;
      border-radius: 10px;
      padding: 9px 12px;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }

    .message .sender {
      color: #8fa1ff;
      font-size: 12px;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .system {
      color: #8f9ab5;
      text-align: center;
      font-size: 12px;
      margin: 10px 0;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .chat-input input {
      margin: 0;
    }

    .chat-input button {
      width: 85px;
    }

    .voice-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .voice-controls button {
      background: #267c55;
    }

    .voice-controls button.off {
      background: #9c3838;
    }

    .voice-help {
      font-size: 12px;
      color: #aeb7d0;
      line-height: 1.8;
      text-align: center;
      margin-top: 10px;
    }

    #audioContainer {
      display: none;
    }
  </style>
</head>

<body>

  <section id="login" class="screen">
    <div class="card">
      <h1>🎮 ورود به روم</h1>

      <input id="name" placeholder="نام شما" maxlength="20" />
      <input id="room" placeholder="کد روم" maxlength="30" />

      <div class="buttons">
        <button onclick="createRoom()">ساخت روم</button>
        <button onclick="joinRoom()">ورود به روم</button>
      </div>

      <div id="status"></div>
    </div>
  </section>

  <section id="chat" class="screen hidden">

    <div class="topbar">
      <div class="room-title">
        🎮 روم: <span id="roomCodeText"></span>
      </div>

      <button class="leave" onclick="leaveRoom()">خروج</button>
    </div>

    <div class="tabs">

      <div class="tab-group">
        <button class="tab" onclick="togglePanel('players')">
          👥 بازیکنان
        </button>

        <div id="playersPanel" class="panel">
          <div id="playersList"></div>
        </div>
      </div>

      <div class="tab-group">
        <button class="tab" onclick="togglePanel('console')">
          🖥️ کنسول
        </button>

        <div id="consolePanel" class="panel">
          <div id="consoleLog"></div>
        </div>
      </div>

    </div>

    <div id="messages"></div>

    <div class="chat-input">
      <input
        id="message"
        placeholder="پیام بنویس..."
        onkeydown="handleEnter(event)"
      />
      <button onclick="sendMessage()">ارسال</button>
    </div>

    <div class="voice-controls">
      <button id="micButton" onclick="toggleMicrophone()">
        🎙️ روشن کردن میکروفون
      </button>

      <button onclick="enableAudio()">
        🔊 فعال‌سازی صدا
      </button>
    </div>

    <div class="voice-help">
      برای کارکرد میکروفون باید سایت با HTTPS باز شود و اجازه میکروفون را تأیید کنید.
    </div>

    <div id="audioContainer"></div>
  </section>

  <script>
    const MAX_PLAYERS = 5;

    let peer = null;
    let myID = null;
    let myName = "";
    let roomCode = "";
    let isHost = false;

    let players = {};
    let connections = {};
    let hostConnection = null;

    let localStream = null;
    let micEnabled = false;
    let activePanel = null;

    const calls = {};
    const audioElements = {};

    function $(id) {
      return document.getElementById(id);
    }

    function setStatus(text) {
      $("status").textContent = text;
    }

    function logConsole(text) {
      const time = new Date().toLocaleTimeString();

      $("consoleLog").textContent +=
        `[${time}] ${text}\n`;

      $("consoleLog").scrollTop =
        $("consoleLog").scrollHeight;
    }

    function togglePanel(panel) {
      const playersPanel = $("playersPanel");
      const consolePanel = $("consolePanel");

      if (activePanel === panel) {
        playersPanel.classList.remove("open");
        consolePanel.classList.remove("open");
        activePanel = null;
        return;
      }

      playersPanel.classList.remove("open");
      consolePanel.classList.remove("open");

      if (panel === "players") {
        playersPanel.classList.add("open");
      }

      if (panel === "console") {
        consolePanel.classList.add("open");
      }

      activePanel = panel;
    }

    function createPeer() {
      return new Promise((resolve, reject) => {
        peer = new Peer();

        peer.on("open", id => {
          myID = id;
          resolve(id);
        });

        peer.on("error", error => {
          logConsole("Peer error: " + error.type);
          console.error(error);
        });

        peer.on("disconnected", () => {
          logConsole("اتصال Peer قطع شد");
        });
      });
    }

    async function createRoom() {
      myName = $("name").value.trim();
      roomCode = $("room").value.trim();

      if (!myName || !roomCode) {
        setStatus("نام و کد روم را وارد کن");
        return;
      }

      isHost = true;

      setStatus("در حال ساخت روم...");

      try {
        await createPeer();

        players[myID] = {
          id: myID,
          name: myName,
          host: true
        };

        peer.on("connection", connection => {
          setupConnection(connection);
        });

        showChat();
        updatePlayers();

        addSystemMessage("روم ساخته شد. منتظر بازیکنان بمانید.");
        logConsole("روم با موفقیت ساخته شد");
      } catch (error) {
        setStatus("ساخت روم ناموفق بود");
        console.error(error);
      }
    }

    async function joinRoom() {
      myName = $("name").value.trim();
      roomCode = $("room").value.trim();

      if (!myName || !roomCode) {
        setStatus("نام و کد روم را وارد کن");
        return;
      }

      isHost = false;
      setStatus("در حال اتصال به میزبان...");

      try {
        await createPeer();

        hostConnection = peer.connect(roomCode, {
          reliable: true
        });

        setupConnection(hostConnection);

        showChat();
        addSystemMessage("در حال اتصال به روم...");
        logConsole("درخواست ورود به میزبان ارسال شد");
      } catch (error) {
        setStatus("ورود به روم ناموفق بود");
        console.error(error);
      }
    }

    function setupConnection(connection) {
      if (!connection) return;

      connection.on("open", () => {
        connections[connection.peer] = connection;

        if (!isHost && connection.peer === roomCode) {
          hostConnection = connection;
        }

        logConsole("اتصال داده‌ای برقرار شد: " + connection.peer);

        if (isHost) {
          connection.send({
            type: "welcome",
            hostID: myID,
            players: players
          });

          broadcast({
            type: "playerJoined",
            player: {
              id: myID,
              name: myName,
              host: true
            }
          });
        } else {
          connection.send({
            type: "join",
            player: {
              id: myID,
              name: myName,
              host: false
            }
          });
        }
      });

      connection.on("data", data => {
        if (isHost) {
          handleHostData(data, connection);
        } else {
          handleGuestData(data);
        }
      });

      connection.on("close", () => {
        delete connections[connection.peer];

        if (players[connection.peer]) {
          const leftPlayer = players[connection.peer];

          delete players[connection.peer];
          updatePlayers();

          addSystemMessage(`${leftPlayer.name} از روم خارج شد`);
        }

        closeVoiceCall(connection.peer);
        logConsole("اتصال بسته شد: " + connection.peer);
      });

      connection.on("error", error => {
        logConsole("خطای اتصال: " + connection.peer);
        console.error(error);
      });
    }

    function handleHostData(data, connection) {
      if (!data || !data.type) return;

      if (data.type === "join") {
        const player = data.player;

        if (Object.keys(players).length >= MAX_PLAYERS) {
          connection.send({
            type: "full"
          });

          return;
        }

        players[player.id] = player;

        updatePlayers();

        addSystemMessage(`${player.name} وارد روم شد`);

        broadcast({
          type: "playerJoined",
          player: player
        });

        broadcast({
          type: "players",
          players: players
        });

        sendVoicePeers();
      }

      if (data.type === "chat") {
        addMessage(data.name, data.message);

        broadcast(data, connection.peer);
      }

      if (data.type === "leave") {
        if (players[data.id]) {
          const playerName = players[data.id].name;

          delete players[data.id];

          updatePlayers();

          addSystemMessage(`${playerName} از روم خارج شد`);

          broadcast({
            type: "playerLeft",
            id: data.id
          });
        }
      }
    }

    function handleGuestData(data) {
      if (!data || !data.type) return;

      if (data.type === "full") {
        addSystemMessage("ظرفیت روم تکمیل است");
        return;
      }

      if (data.type === "welcome") {
        players = data.players || {};

        players[myID] = {
          id: myID,
          name: myName,
          host: false
        };

        updatePlayers();

        addSystemMessage("با موفقیت وارد روم شدی");
        logConsole("اطلاعات روم دریافت شد");

        ensureVoiceConnections();
      }

      if (data.type === "players") {
        players = data.players || {};

        players[myID] = {
          id: myID,
          name: myName,
          host: false
        };

        updatePlayers();
        ensureVoiceConnections();
      }

      if (data.type === "playerJoined") {
        players[data.player.id] = data.player;

        updatePlayers();
        addSystemMessage(`${data.player.name} وارد روم شد`);

        ensureVoiceConnections();
      }

      if (data.type === "playerLeft") {
        const player = players[data.id];

        if (player) {
          addSystemMessage(`${player.name} از روم خارج شد`);
        }

        delete players[data.id];
        closeVoiceCall(data.id);
        updatePlayers();
      }

      if (data.type === "chat") {
        addMessage(data.name, data.message);
      }

      if (data.type === "voicePeers") {
        ensureVoiceConnections(data.peers);
      }
    }

    function broadcast(data, exceptID = null) {
      Object.keys(connections).forEach(id => {
        if (id === exceptID) return;

        const connection = connections[id];

        if (connection && connection.open) {
          connection.send(data);
        }
      });
    }

    function sendVoicePeers() {
      if (!isHost) return;

      const peerIDs = Object.keys(players);

      broadcast({
        type: "voicePeers",
        peers: peerIDs
      });
    }

    function ensureVoiceConnections(peerList = null) {
      if (!localStream) return;

      const ids = peerList || Object.keys(players);

      ids.forEach(targetID => {
        if (!targetID || targetID === myID) return;
        if (calls[targetID]) return;

        startCall(targetID);
      });
    }

    async function toggleMicrophone() {
      if (micEnabled) {
        stopMicrophone();
        return;
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });

        micEnabled = true;

        localStream.getAudioTracks().forEach(track => {
          track.enabled = true;
        });

        $("micButton").textContent = "🔴 خاموش کردن میکروفون";
        $("micButton").classList.add("off");

        addSystemMessage("میکروفون روشن شد");
        logConsole("میکروفون فعال شد");

        ensureVoiceConnections();
      } catch (error) {
        addSystemMessage("دسترسی به میکروفون داده نشد");
        logConsole("خطای میکروفون: " + error.message);

        alert(
          "برای استفاده از میکروفون باید اجازه دسترسی بدهی و سایت با HTTPS باز شود."
        );
      }
    }

    function startCall(targetID) {
      if (!localStream) return;
      if (!targetID || targetID === myID) return;
      if (calls[targetID]) return;

      try {
        const call = peer.call(targetID, localStream);

        calls[targetID] = call;

        call.on("stream", stream => {
          playAudio(targetID, stream);
        });

        call.on("close", () => {
          closeVoiceCall(targetID);
        });

        call.on("error", error => {
          logConsole("خطای تماس صوتی: " + targetID);
          console.error(error);
        });

        logConsole("تماس صوتی ارسال شد: " + targetID);
      } catch (error) {
        logConsole("تماس صوتی برقرار نشد");
        console.error(error);
      }
    }

    function setupIncomingCalls() {
      peer.on("call", call => {
        logConsole("تماس صوتی ورودی از: " + call.peer);

        calls[call.peer] = call;

        call.answer(localStream || undefined);

        call.on("stream", stream => {
          playAudio(call.peer, stream);
        });

        call.on("close", () => {
          closeVoiceCall(call.peer);
        });

        call.on("error", error => {
          logConsole("خطای تماس ورودی");
          console.error(error);
        });
      });
    }

    function playAudio(id, stream) {
      let audio = audioElements[id];

      if (!audio) {
        audio = document.createElement("audio");

        audio.autoplay = true;
        audio.playsInline = true;
        audio.controls = false;
        audio.muted = false;

        $("audioContainer").appendChild(audio);
        audioElements[id] = audio;
      }

      audio.srcObject = stream;
      audio.volume = 1;

      const playPromise = audio.play();

      if (playPromise) {
        playPromise.catch(() => {
          logConsole("برای شنیدن صدا روی فعال‌سازی صدا بزنید");
        });
      }
    }

    function enableAudio() {
      Object.values(audioElements).forEach(audio => {
        audio.muted = false;
        audio.volume = 1;

        const playPromise = audio.play();

        if (playPromise) {
          playPromise.catch(error => {
            console.log(error);
          });
        }
      });

      addSystemMessage("تلاش برای فعال‌سازی صدای بازیکنان انجام شد");
    }

    function closeVoiceCall(id) {
      if (calls[id]) {
        try {
          calls[id].close();
        } catch (error) {}
      }

      delete calls[id];

      if (audioElements[id]) {
        audioElements[id].srcObject = null;
        audioElements[id].remove();
        delete audioElements[id];
      }
    }

    function stopMicrophone() {
      if (localStream) {
        localStream.getTracks().forEach(track => {
          track.stop();
        });

        localStream = null;
      }

      Object.keys(calls).forEach(id => {
        closeVoiceCall(id);
      });

      micEnabled = false;

      $("micButton").textContent = "🎙️ روشن کردن میکروفون";
      $("micButton").classList.remove("off");

      addSystemMessage("میکروفون خاموش شد");
      logConsole("میکروفون خاموش شد");
    }

    function updatePlayers() {
      const list = $("playersList");
      list.innerHTML = "";

      Object.values(players).forEach(player => {
        const div = document.createElement("div");

        div.className = "player";

        div.innerHTML =
          `${player.host ? "👑 " : "👤 "}` +
          `<span class="${player.host ? "host" : ""}">` +
          escapeHTML(player.name) +
          `</span>`;

        list.appendChild(div);
      });
    }

    function showChat() {
      $("login").classList.add("hidden");
      $("chat").classList.remove("hidden");

      $("roomCodeText").textContent = roomCode;

      setupIncomingCalls();
    }

    function addSystemMessage(text) {
      const div = document.createElement("div");

      div.className = "system";
      div.textContent = text;

      $("messages").appendChild(div);
      scrollMessages();
    }

    function addMessage(name, message) {
      const div = document.createElement("div");

      div.className = "message";

      div.innerHTML = `
        <div class="sender">${escapeHTML(name)}</div>
        <div>${escapeHTML(message)}</div>
      `;

      $("messages").appendChild(div);
      scrollMessages();
    }

    function sendMessage() {
      const input = $("message");
      const message = input.value.trim();

      if (!message) return;

      const data = {
        type: "chat",
        name: myName,
        message: message
      };

      addMessage(myName, message);

      if (isHost) {
        broadcast(data);
      } else if (hostConnection && hostConnection.open) {
        hostC
