<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceRoom</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: #0f1422;
      color: white;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
    }

    .hidden {
      display: none !important;
    }

    /* Login */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .loginBox {
      width: 100%;
      max-width: 420px;
      background: #1a2133;
      padding: 30px;
      border-radius: 20px;
      border: 1px solid #35415c;
      text-align: center;
      box-shadow: 0 15px 40px #0005;
    }

    .loginBox h1 {
      color: #8d9bff;
      margin-top: 0;
    }

    .loginBox input {
      width: 100%;
      margin: 8px 0;
      padding: 14px;
      border: 1px solid #414d6b;
      border-radius: 10px;
      background: #111827;
      color: white;
      outline: none;
      direction: ltr;
    }

    .loginBox button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-weight: bold;
    }

    .loginBox button:hover {
      background: #4752c4;
    }

    #loginStatus {
      color: #ffb4b4;
      font-size: 13px;
      margin-top: 12px;
    }

    /* App */

    #app {
      min-height: 100vh;
    }

    .topbar {
      min-height: 74px;
      padding: 12px 16px;
      border: 1px solid #35415c;
      border-radius: 16px;
      background: #151b2b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 20px;
      font-weight: bold;
      color: #8d9bff;
    }

    .brand small {
      font-size: 12px;
      color: #ddd;
      font-weight: normal;
    }

    .topButtons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .topButtons button {
      padding: 10px 14px;
      border-radius: 13px;
      background: #5865f2;
      color: white;
      font-size: 12px;
      transition: 0.2s;
    }

    .topButtons button:hover {
      filter: brightness(1.15);
    }

    #audioBtn.off {
      background: #e5484d;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 15px;
      padding: 15px;
      max-width: 1400px;
      margin: auto;
    }

    .mainPanel,
    .sidePanel {
      background: #171e30;
      border: 1px solid #35415c;
      border-radius: 16px;
      padding: 16px;
    }

    .mainPanel h2,
    .sidePanel h3 {
      margin-top: 0;
      color: #aab4ff;
    }

    #roomInfo {
      background: #101625;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      direction: ltr;
      text-align: left;
      word-break: break-word;
    }

    #inviteLink {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #3b4660;
      background: #0d1320;
      color: #cdd4ff;
      direction: ltr;
      margin-top: 8px;
    }

    #players {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player {
      background: #222b42;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
    }

    .hostBadge {
      color: #ffd45c;
    }

    .chatBox {
      margin-top: 18px;
    }

    #messages {
      height: 270px;
      overflow-y: auto;
      background: #0d1320;
      border-radius: 10px;
      padding: 10px;
      border: 1px solid #303b55;
    }

    .message {
      background: #252f48;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 7px;
      word-break: break-word;
    }

    .message strong {
      color: #9da8ff;
    }

    .systemMessage {
      color: #aab4c9;
      font-size: 12px;
      text-align: center;
      margin: 8px;
    }

    .chatInput {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .chatInput input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #3b4660;
      background: #0d1320;
      color: white;
      outline: none;
    }

    .chatInput button {
      padding: 10px 16px;
      border-radius: 9px;
      background: #5865f2;
      color: white;
    }

    #audioContainer {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }

    #audioContainer audio {
      width: 100%;
      height: 35px;
    }

    .status {
      font-size: 12px;
      color: #9ca8c7;
      margin-top: 12px;
    }

    @media (max-width: 750px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
      }

      .brand {
        width: 100%;
        justify-content: flex-end;
      }

      .topButtons {
        width: 100%;
        justify-content: center;
      }

      .topButtons button {
        flex: 1;
        padding: 10px 7px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <!-- صفحه ورود -->

  <section id="loginScreen">
    <div class="loginBox">
      <h1>🎙️ VoiceRoom</h1>

      <input
        id="nameInput"
        type="text"
        placeholder="نام شما"
        maxlength="25"
      />

      <input
        id="roomInput"
        type="text"
        placeholder="کد روم انگلیسی"
        maxlength="40"
        dir="ltr"
      />

      <button onclick="createRoom()">ساخت روم</button>
      <button onclick="joinRoom()">ورود به روم</button>

      <div id="loginStatus"></div>
    </div>
  </section>

  <!-- برنامه اصلی -->

  <section id="app" class="hidden">

    <header class="topbar">

      <div class="topButtons">
        <button onclick="copyInvite()">🔗 دعوت</button>

        <button onclick="toggleMic()" id="micBtn">
          🎤 میکروفون
        </button>

        <button onclick="toggleAudio()" id="audioBtn">
          🔇 روشن کردن صدا
        </button>

        <button onclick="leaveRoom()">
          🚪 خروج
        </button>
      </div>

      <div class="brand">
        VoiceRoom 🎙️
        <small id="userInfo">وارد نشده</small>
      </div>

    </header>

    <div class="layout">

      <main class="mainPanel">

        <h2>روم صوتی</h2>

        <div id="roomInfo">
          Room: <span id="roomName">---</span>
        </div>

        <label>لینک دعوت:</label>
        <input id="inviteLink" readonly />

        <div class="chatBox">
          <h2>💬 چت روم</h2>

          <div id="messages"></div>

          <div class="chatInput">
            <input
              id="messageInput"
              type="text"
              placeholder="پیام خود را بنویسید..."
              maxlength="300"
              onkeydown="handleEnter(event)"
            />

            <button onclick="sendMessage()">ارسال</button>
          </div>
        </div>

        <div id="audioContainer"></div>

        <div class="status" id="connectionStatus">
          وضعیت: آماده
        </div>

      </main>

      <aside class="sidePanel">
        <h3>👥 اعضای روم</h3>
        <div id="players"></div>
      </aside>

    </div>

  </section>

  <script>
    let peer = null;
    let roomCode = "";
    let userName = "";
    let isHost = false;

    let localStream = null;
    let micEnabled = false;
    let audioEnabled = false;

    let connections = {};
    let calls = {};
    let players = {};

    const $ = id => document.getElementById(id);

    /* ابزارهای کمکی */

    function setLoginStatus(text) {
      $("loginStatus").textContent = text;
    }

    function setStatus(text) {
      $("connectionStatus").textContent = "وضعیت: " + text;
    }

    function normalizeRoomCode(value) {
      return value
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9-]/g, "");
    }

    function validRoomCode(code) {
      return /^[a-z][a-z0-9-]{2,39}$/.test(code);
    }

    function getInviteLink() {
      return location.origin +
        location.pathname +
        "#room=" +
        encodeURIComponent(roomCode);
    }

    function loadRoomFromURL() {
      const hash = location.hash;

      if (hash.startsWith("#room=")) {
        const code = decodeURIComponent(
          hash.substring(6)
        );

        $("roomInput").value = code;
      }
    }

    async function copyInvite() {
      const link = getInviteLink();

      try {
        await navigator.clipboard.writeText(link);
        addSystem("لینک دعوت کپی شد 🔗");
      } catch {
        $("inviteLink").select();
        document.execCommand("copy");
        addSystem("لینک دعوت کپی شد 🔗");
      }
    }

    /* ساخت و ورود به روم */

    function createRoom() {
      userName = $("nameInput").value.trim();
      roomCode = normalizeRoomCode($("roomInput").value);

      if (!userName) {
        setLoginStatus("لطفاً نام خود را وارد کنید.");
        return;
      }

      if (!validRoomCode(roomCode)) {
        setLoginStatus(
          "کد روم باید حداقل ۳ حرف داشته باشد و با حروف انگلیسی شروع شود."
        );
        return;
      }

      isHost = true;
      startPeer(roomCode);
    }

    function joinRoom() {
      userName = $("nameInput").value.trim();
      roomCode = normalizeRoomCode($("roomInput").value);

      if (!userName) {
        setLoginStatus("لطفاً نام خود را وارد کنید.");
        return;
      }

      if (!validRoomCode(roomCode)) {
        setLoginStatus("کد روم صحیح نیست.");
        return;
      }

      isHost = false;
      startPeer();
    }

    function startPeer(customId = null) {
      setLoginStatus("در حال اتصال...");

      peer = customId
        ? new Peer(customId)
        : new Peer();

      peer.on("open", id => {
        showApp();

        players[id] = {
          id: id,
          name: userName,
          host: isHost
        };

        updatePlayers();

        if (isHost) {
          addSystem("روم با موفقیت ساخته شد 🎉");
        } else {
          connectToHost();
        }

        setupPeerEvents();
      });

      peer.on("error", error => {
        console.error(error);

        if (error.type === "unavailable-id") {
          setLoginStatus("این کد روم قبلاً استفاده شده است.");
        } else {
          setLoginStatus("خطا در اتصال به سرور.");
        }
      });
    }

    function setupPeerEvents() {
      peer.on("connection", connection => {
        setupConnection(connection);
      });

      peer.on("call", call => {
        handleIncomingCall(call);
      });
    }

    function showApp() {
      $("loginScreen").classList.add("hidden");
      $("app").classList.remove("hidden");

      $("roomName").textContent = roomCode;
      $("userInfo").textContent =
        userName + (isHost ? " 👑" : "");

      $("inviteLink").value = getInviteLink();

      setStatus("متصل");
    }

    /* ارتباط داده‌ای */

    function connectToHost() {
      const connection = peer.connect(roomCode, {
        reliable: true
      });

      setupConnection(connection);
    }

    function setupConnection(connection) {
      connections[connection.peer] = connection;

      connection.on("open", () => {
        connection.send({
          type: "join",
          id: peer.id,
          name: userName
        });

        if (!isHost) {
          connection.send({
            type: "requestPlayers"
          });
        }
      });

      connection.on("data", data => {
        if (isHost) {
          handleHostData(connection, data);
        } else {
          handleGuestData(data);
        }
      });

      connection.on("close", () => {
        delete connections[connection.peer];

        if (players[connection.peer]) {
          addSystem(
            players[connection.peer].name +
            " از روم خارج شد."
          );

          delete players[connection.peer];
          updatePlayers();
        }

        removeAudio(connection.peer);
      });

      connection.on("error", error => {
        console.log("Connection error:", error);
      });
    }

    function handleHostData(connection, data) {
      if (data.type === "join") {
        if (Object.keys(players).length >= 5) {
          connection.send({
            type: "full"
          });

          return;
        }

        players[data.id] = {
          id: data.id,
          name: data.name,
          host: false
        };

        broadcast({
          type: "players",
          players: players
        });

        broadcast({
          type: "system",
          text: data.name + " وارد روم شد 🎉"
        });

        updatePlayers();
      }

      if (data.type === "requestPlayers") {
        connection.send({
          type: "players",
          players: players
        });
      }

      if (data.type === "chat") {
        broadcast(data);
        addMessage(data.name, data.text);
      }
    }

    function handleGuestData(data) {
      if (data.type === "players") {
        players = data.players;
        updatePlayers();
      }

      if (data.type === "chat") {
        addMessage(data.name, data.text);
      }

      if (data.type === "system") {
        addSystem(data.text);
      }

      if (data.type === "full") {
        alert("ظرفیت روم تکمیل است.");
        leaveRoom();
      }
    }

    function broadcast(data, exceptId = null) {
      Object.values(connections).forEach(connection => {
        if (
          connection.open &&
          connection.peer !== exceptId
        ) {
          connection.send(data);
        }
      });
    }

    /* اعضای روم */

    function updatePlayers() {
      $("players").innerHTML = "";

      Object.values(players).forEach(player => {
        const div = document.createElement("div");

        div.className = "player";

        const name = document.createElement("span");
        name.textContent = player.name;

        const badge = document.createElement("span");

        if (player.host) {
          badge.textContent = "👑";
          badge.className = "hostBadge";
        } else {
          badge.textContent = "🎧";
        }

        div.appendChild(name);
        div.appendChild(badge);

        $("players").appendChild(div);
      });
    }

    /* چت */

    function sendMessage() {
      const input = $("messageInput");
      const text = input.value.trim();

      if (!text) return;

      const data = {
        type: "chat",
        name: userName,
        text: text
      };

      addMessage(userName, text);

      if (isHost) {
        broadcast(data);
      } else {
        Object.values(connections).forEach(connection => {
          if (connection.open) {
            connection.send(data);
          }
        });
      }

      input.value = "";
    }

    function handleEnter(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    function addMessage(name, text) {
      const message = document.createElement("div");

      message.className = "message";

      const strong = document.createElement("strong");
      strong.textContent = name + ": ";

      const span = document.createElement("span");
      span.textContent = text;

      message.appendChild(strong);
      message.appendChild(span);

      $("messages").appendChild(message);
      scrollMessages();
    }

    function addSystem(text) {
      const message = document.createElement("div");

      message.className = "systemMessage";
      message.textContent = text;

      $("messages").appendChild(message);
      scrollMessages();
    }

    function scrollMessages() {
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    /* میکروفون */

    async function toggleMic() {
      if (!micEnabled) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false
          });

          micEnabled = true;

          $("micBtn").textContent = "🎤 خاموش کردن میکروفون";
          $("micBtn").style.background = "#e5484d";

          startCallsToUsers();

          addSystem("میکروفون روشن شد 🎤");
        } catch (error) {
          alert("دسترسی به میکروفون داده نشد.");
          console.error(error);
        }
      } else {
        stopMicrophone();

        micEnabled = false;

        $("micBtn").textContent = "🎤 میکروفون";
        $("micBtn").style.background = "#5865f2";

        addSystem("میکروفون خاموش شد 🔇");
      }
    }

    function startCallsToUsers() {
      Object.keys(players).forEach(id => {
        if (id === peer.id) return;
        if (calls[id]) return;

        startCall(id);
      });
    }

    function startCall(id) {
      if (!localStream || !peer) return;

      const call = peer.call(id, localStream);

      if (!call) return;

      calls[id] = call;

      call.on("stream", remoteStream => {
        playAudio(id, remoteStream);
      });

      call.on("close", () => {
        removeAudio(id);
        delete calls[id];
      });

      call.on("error", error => {
        console.log("Call error:", error);
      });
    }

    function handleIncomingCall(call) {
      calls[call.peer] = call;

      if (localStream) {
        call.answer(localStream);
      } else {
        call.answer();
      }

      call.on("stream", remoteStream => {
        playAudio(call.peer, remoteStream);
      });

      call.on("close", () => {
        removeAudio(call.peer);
        delete calls[call.peer];
      });
    }

    function playAudio(id, stream) {
      let audio = $("audio-" + id);

      if (!audio) {
        audio = document.createElement("audio");

        audio.id = "audio-" + id;
        audio.autoplay = true;
        audio.playsInline = true;
        audio.controls = true;
        audio.setAttribute("aria-label", "صدای کاربر");

        $("audioContainer").appendChild(audio);
      }

      audio.srcObject = stream;

      // وضعیت دکمه بلندگو روی صدای دریافتی اعمال می‌شود
      audio.muted = !audioEnabled;

      if (audioEnabled) {
        audio.play().catch(() => {});
      }
    }

    /* روشن و خاموش کردن صدای دیگران */

    function toggleAudio() {
      audioEnabled = !audioEnabled;

      document
        .querySelectorAll("#audioContainer audio")
        .forEach(audio => {
          audio.muted = !audioEnabled;

          if (audioEnabled) {
            audio.play().catch(() => {});
          }
        });

      const button = $("audioBtn");

      if (audioEnabled) {
        button.textContent = "🔊 خاموش کردن صدا";
        button.classList.remove("off");

        addSystem("صدای کاربران روشن شد 🔊");
      } else {
        button.textContent = "🔇 روشن کردن صدا";
        button.classList.add("off");

        addSystem("صدای کاربران خاموش شد 🔇");
      }
    }

    function removeAudio(id) {
      const audio = $("audio-" + id);

      if (audio) {
        audio.srcObject = null;
        audio.remove();
      }
    }

    function stopMicrophone() {
      if (localStream) {
        localStream.getTracks().forEach(track => {
          track.stop();
        });

        localStream = null;
      }

      Object.values(calls).forEach(call => {
        try {
          call.close();
        } catch {}
      });

      calls = {};
    }

    /* خروج */

    function leaveRoom() {
      stopMicrophone();

      Object.values(connections).forEach(connection => {
        try {
          connection.close();
        } catch {}
      });

      connections = {};

      if (peer) {
        peer.destroy();
        peer = null;
      }

      location.hash = "";
      location.reload();
    }

    /* شروع */

    loadRoomFromURL();
  </script>

</body>
</html>
