<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>روم آنلاین</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #10131c;
      color: white;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      background: #5865f2;
      color: white;
      margin: 5px;
    }

    button:hover {
      background: #4752c4;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #34394d;
      border-radius: 10px;
      background: #1d2230;
      color: white;
      outline: none;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 25px;
      border-radius: 18px;
      background: #191e2b;
      box-shadow: 0 0 30px #0006;
      text-align: center;
    }

    h1 {
      color: #7289ff;
    }

    .hint {
      color: #aaa;
      font-size: 12px;
    }

    #chatScreen {
      display: none;
      min-height: 100vh;
      padding: 12px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: #191e2b;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .room-title {
      color: #8d99ff;
      font-weight: bold;
    }

    .layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 12px;
      max-width: 1200px;
      margin: auto;
    }

    .panel, .chatbox {
      background: #191e2b;
      border-radius: 14px;
      padding: 14px;
    }

    .panel h3 {
      margin-top: 5px;
      color: #8d99ff;
    }

    .player {
      padding: 10px;
      background: #252b3c;
      border-radius: 9px;
      margin: 7px 0;
      font-size: 13px;
    }

    .host {
      color: #ffd34e;
    }

    #messages {
      height: 55vh;
      min-height: 280px;
      overflow-y: auto;
      padding: 10px;
      background: #10131c;
      border-radius: 10px;
    }

    .message {
      background: #292f42;
      padding: 9px;
      margin: 7px 0;
      border-radius: 9px;
      word-break: break-word;
    }

    .system {
      color: #9ca3af;
      font-size: 12px;
      text-align: center;
      margin: 8px;
    }

    .send-area {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .send-area input {
      margin: 0;
    }

    .send-area button {
      margin: 0;
    }

    #consoleLog {
      max-height: 180px;
      overflow-y: auto;
      background: #10131c;
      padding: 8px;
      border-radius: 8px;
      font-size: 10px;
      color: #aaa;
      direction: ltr;
      text-align: left;
    }

    #audioContainer audio {
      width: 100%;
      margin-top: 5px;
    }

    @media (max-width: 700px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .panel {
        order: 2;
      }

      #messages {
        height: 55vh;
      }
    }
  </style>
</head>

<body>

  <!-- صفحه ورود -->
  <div id="loginScreen" class="screen">
    <div class="card">
      <h1>🎮 روم آنلاین</h1>

      <input id="name" placeholder="نام شما">

      <input id="room" placeholder="کد روم، مثال: room123">

      <button onclick="createRoom()">🏠 ساخت روم</button>
      <button onclick="joinRoom()">🚪 ورود به روم</button>

      <p id="status" class="hint">نام و کد روم را وارد کنید</p>

      <p class="hint">
        کد روم باید با حرف انگلیسی شروع شود.
      </p>
    </div>
  </div>

  <!-- صفحه روم -->
  <div id="chatScreen">

    <div class="topbar">
      <div>
        🎮 <span class="room-title" id="roomCodeText"></span>
      </div>

      <div>
        <button onclick="togglePanel('playersPanel')">👥 بازیکنان</button>
        <button onclick="togglePanel('consolePanel')">🛠 کنسول</button>
        <button onclick="toggleMicrophone()" id="micButton">🎤 فعال‌سازی میکروفون</button>
        <button onclick="enableAudio()">🔊 فعال‌سازی صدا</button>
        <button onclick="leaveRoom()">🚪 خروج</button>
      </div>
    </div>

    <div class="layout">

      <aside>
        <div id="playersPanel" class="panel">
          <h3>👥 بازیکنان</h3>
          <div id="playersList"></div>
        </div>

        <div id="consolePanel" class="panel" style="display:none">
          <h3>🛠 کنسول</h3>
          <div id="consoleLog"></div>
        </div>

        <div class="panel">
          <h3>🔊 صداها</h3>
          <div id="audioContainer"></div>
        </div>
      </aside>

      <main class="chatbox">
        <h3>💬 چت روم</h3>

        <div id="messages"></div>

        <div class="send-area">
          <input id="message" placeholder="پیام خود را بنویسید..."
                 onkeydown="handleEnter(event)">
          <button onclick="sendMessage()">ارسال</button>
        </div>
      </main>

    </div>
  </div>

<script>
  const MAX_PLAYERS = 5;

  let peer = null;
  let myID = "";
  let myName = "";
  let roomCode = "";
  let hostPeerId = "";
  let isHost = false;

  let players = {};
  let connections = {};
  let hostConnection = null;

  let localStream = null;
  let microphoneEnabled = false;
  let calls = {};
  let audioEnabled = true;
  let incomingSetup = false;

  const $ = id => document.getElementById(id);

  function setStatus(text) {
    $("status").textContent = text;
  }

  function logConsole(text) {
    const time = new Date().toLocaleTimeString();
    $("consoleLog").innerHTML +=
      `<div>[${time}] ${escapeHTML(text)}</div>`;
    $("consoleLog").scrollTop = $("consoleLog").scrollHeight;
    console.log(text);
  }

  function escapeHTML(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function normalizeRoomCode(value) {
    const code = value.trim().toLowerCase();

    if (!/^[a-z][a-z0-9-]{2,39}$/.test(code)) {
      throw new Error(
        "کد روم باید با حرف انگلیسی شروع شود و فقط شامل حروف انگلیسی، عدد و خط تیره باشد."
      );
    }

    return code;
  }

  function togglePanel(id) {
    const panel = $(id);
    panel.style.display =
      panel.style.display === "none" ? "block" : "none";
  }

  function createRoom() {
    const name = $("name").value.trim();
    const rawRoom = $("room").value;

    if (!name) {
      setStatus("لطفاً نام خود را وارد کنید.");
      return;
    }

    try {
      roomCode = normalizeRoomCode(rawRoom);
    } catch (error) {
      setStatus(error.message);
      return;
    }

    myName = name;
    hostPeerId = roomCode;
    isHost = true;

    players = {};
    connections = {};

    logConsole("در حال ساخت روم...");
    createPeer(hostPeerId);
  }

  function joinRoom() {
    const name = $("name").value.trim();
    const rawRoom = $("room").value;

    if (!name) {
      setStatus("لطفاً نام خود را وارد کنید.");
      return;
    }

    try {
      roomCode = normalizeRoomCode(rawRoom);
    } catch (error) {
      setStatus(error.message);
      return;
    }

    myName = name;
    hostPeerId = roomCode;
    isHost = false;

    players = {};
    connections = {};

    logConsole("در حال اتصال به روم...");
    createPeer(null);
  }

  function createPeer(customID = null) {
    if (peer) {
      try {
        peer.destroy();
      } catch (e) {}
    }

    peer = customID
      ? new Peer(customID, { debug: 1 })
      : new Peer(undefined, { debug: 1 });

    peer.on("open", id => {
      myID = id;

      logConsole("شناسه شما: " + id);

      if (isHost) {
        players[myID] = {
          id: myID,
          name: myName,
          host: true
        };

        showChat();
        addSystemMessage("روم با موفقیت ساخته شد.");

        updatePlayers();
      } else {
        showChat();

        hostConnection = peer.connect(hostPeerId, {
          reliable: true
        });

        setupConnection(hostConnection);

        addSystemMessage("در حال اتصال به میزبان...");
      }
    });

    peer.on("connection", connection => {
      logConsole("اتصال جدید دریافت شد.");

      if (!isHost) return;

      setupConnection(connection);
    });

    peer.on("call", call => {
      handleIncomingCall(call);
    });

    peer.on("error", error => {
      logConsole("خطا: " + error.type);

      if (error.type === "unavailable-id") {
        setStatus("این کد روم قبلاً استفاده شده است. کد دیگری انتخاب کنید.");
      } else if (error.type === "invalid-id") {
        setStatus("کد روم نامعتبر است.");
      } else if (error.type === "peer-unavailable") {
        addSystemMessage("روم پیدا نشد یا میزبان آنلاین نیست.");
      } else {
        setStatus("خطا در اتصال: " + error.type);
      }
    });

    peer.on("disconnected", () => {
      logConsole("اتصال Peer قطع شد.");
    });
  }

  function showChat() {
    $("loginScreen").style.display = "none";
    $("chatScreen").style.display = "block";
    $("roomCodeText").textContent = "روم: " + roomCode;

    if (!incomingSetup) {
      incomingSetup = true;
    }
  }

  function setupConnection(connection) {
    if (!connection) return;

    connections[connection.peer] = connection;

    connection.on("open", () => {
      logConsole("اتصال باز شد: " + connection.peer);

      if (isHost) {
        connection.send({
          type: "welcome",
          hostID: myID,
          players: players
        });
      } else {
        connection.send({
          type: "join",
          name: myName
        });
      }
    });

    connection.on("data", data => {
      if (isHost) {
        handleHostData(data, connection);
      } else {
        handleGuestData(data);
      }
    });

    connection.on("close", () => {
      const disconnectedID = connection.peer;

      delete connections[disconnectedID];

      if (isHost && players[disconnectedID]) {
        const disconnectedName = players[disconnectedID].name;

        delete players[disconnectedID];

        addSystemMessage(disconnectedName + " از روم خارج شد.");
        broadcast({
          type: "players",
          players: players
        });

        updatePlayers();
      }
    });

    connection.on("error", error => {
      logConsole("خطای اتصال: " + error);
    });
  }

  function handleHostData(data, connection) {
    if (!data || !data.type) return;

    if (data.type === "join") {
      const currentCount = Object.keys(players).length;

      if (currentCount >= MAX_PLAYERS) {
        connection.send({
          type: "roomFull"
        });
        return;
      }

      players[connection.peer] = {
        id: connection.peer,
        name: String(data.name || "بازیکن"),
        host: false
      };

      connection.send({
        type: "welcome",
        hostID: myID,
        players: players
      });

      broadcast({
        type: "players",
        players: players
      });

      broadcast({
        type: "system",
        message: players[connection.peer].name + " وارد روم شد."
      });

      updatePlayers();
      return;
    }

    if (data.type === "message") {
      broadcast(data);
      addMessage(data.name, data.message);
      return;
    }

    if (data.type === "leave") {
      const player = players[connection.peer];

      if (player) {
        addSystemMessage(player.name + " خارج شد.");
        delete players[connection.peer];
      }

      broadcast({
        type: "players",
        players: players
      });

      updatePlayers();
    }
  }

  function handleGuestData(data) {
    if (!data || !data.type) return;

    if (data.type === "welcome") {
      hostPeerId = data.hostID || hostPeerId;
      players = data.players || {};

      addSystemMessage("با موفقیت وارد روم شدید.");
      updatePlayers();
      ensureVoiceConnections();
      return;
    }

    if (data.type === "players") {
      players = data.players || {};
      updatePlayers();
      ensureVoiceConnections();
      return;
    }

    if (data.type === "message") {
      addMessage(data.name, data.message);
      return;
    }

    if (data.type === "system") {
      addSystemMessage(data.message);
      return;
    }

    if (data.type === "roomFull") {
      addSystemMessage("ظرفیت روم تکمیل است.");
      return;
    }
  }

  function broadcast(data, exceptID = null) {
    Object.keys(connections).forEach(id => {
      if (id === exceptID) return;

      const connection = connections[id];

      if (connection && connection.open) {
        try {
          connection.send(data);
        } catch (error) {
          logConsole("ارسال ناموفق به " + id);
        }
      }
    });
  }

  function updatePlayers() {
    const list = $("playersList");
    list.innerHTML = "";

    Object.values(players).forEach(player => {
      const div = document.createElement("div");
      div.className = "player";

      div.innerHTML =
        escapeHTML(player.name) +
        (player.host ? ' <span class="host">👑 میزبان</span>' : "");

      list.appendChild(div);
    });

    if (Object.keys(players).length === 0) {
      list.innerHTML = "<div>بازیکنی وجود ندارد.</div>";
    }
  }

  function sendMessage() {
    const input = $("message");
    const message = input.value.trim();

    if (!message) return;

    const data = {
      type: "message",
      name: myName,
      message: message
    };

    addMessage(myName, message);

    if (isHost) {
      broadcast(data);
    } else if (hostConnection && hostConnection.open) {
      hostConnection.send(data);
    }

    input.value = "";
    input.focus();
  }

  function handleEnter(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  }

  function addMessage(name, message) {
    const div = document.createElement("div");
    div.className = "message";

    div.innerHTML =
      "<b>" + escapeHTML(name) + ":</b> " +
      escapeHTML(message);

    $("messages").appendChild(div);
    scrollMessages();
  }

  function addSystemMessage(message) {
    const div = document.createElement("div");
    div.className = "system";
    div.textContent = "— " + message + " —";

    $("messages").appendChild(div);
    scrollMessages();
  }

  function scrollMessages() {
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  async function toggleMicrophone() {
    if (microphoneEnabled) {
      stopMicrophone();
      return;
    }

    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: false
      });

      microphoneEnabled = true;
      $("micButton").textContent = "🔇 خاموش کردن میکروفون";

      addSystemMessage("میکروفون فعال شد.");
      logConsole("میکروفون فعال شد.");

      closeAllCalls();
      setTimeout(ensureVoiceConnections, 500);

    } catch (error) {
      addSystemMessage("دسترسی به میکروفون داده نشد.");
      logConsole("خطای میکروفون: " + error.message);
    }
  }

  function stopMicrophone() {
    if (localStream) {
      localStream.getTracks().forEach(track => track.stop());
      localStream = null;
    }

    microphoneEnabled = false;
    $("micButton").textContent = "🎤 فعال‌سازی میکروفون";

    closeAllCalls();
    addSystemMessage("میکروفون خاموش شد.");
  }

  function ensureVoiceConnections() {
    if (!peer || !microphoneEnabled || !localStream) return;

    Object.keys(players).forEach(id => {
      if (id === myID) return;

      if (!calls[id]) {
        startCall(id);
      }
    });
  }

  function startCall(targetID) {
    if (!peer || !localStream || calls[targetID]) return;

    logConsole("تماس صوتی با " + targetID);

    const call = peer.call(targetID, localStream);

    if (!call) return;

    calls[targetID] = call;

    call.on("stream", remoteStream => {
      playAudio(targetID, remoteStream);
    });

    call.on("close", () => {
      delete calls[targetID];
      removeAudio(targetID);
    });

    call.on("error", () => {
      delete calls[targetID];
      removeAudio(targetID);
    });
  }

  function handleIncomingCall(call) {
    if (!call) return;

    if (calls[call.peer]) {
      try {
        call.close();
      } catch (e) {}
      return;
    }

    calls[call.peer] = call;

    call.answer(localStream || undefined);

    call.on("stream", remoteStream => {
      playAudio(call.peer, remoteStream);
    });

    call.on("close", () => {
      delete calls[call.peer];
      removeAudio(call.peer);
    });

    call.on("error", () => {
      delete calls[call.peer];
      removeAudio(call.peer);
    });
  }

  function playAudio(id, stream) {
    let audio = document.getElementById("audio-" + id);

    if (!audio) {
      audio = document.createElement("audio");
      audio.id = "audio-" + id;
      audio.autoplay = true;
      audio.playsInline = true;
      audio.controls = true;

      $("audioContainer").appendChild(audio);
    }

    audio.srcObject = stream;

    if (audioEnabled) {
      audio.play().catch(() => {
        logConsole("برای پخش صدا روی فعال‌سازی صدا بزنید.");
      });
    }
  }

  function removeAudio(id) {
    const audio = document.getElementById("audio-" + id);

    if (audio) {
      audio.srcObject = null;
      audio.remove();
    }
  }

  function closeAllCalls() {
    Object.keys(calls).forEach(id => {
      try {
        calls[id].close();
      } catch (e) {}

      removeAudio(id);
    });

    calls = {};
  }

  function enableAudio() {
    audioEnabled = true;

    document.querySelectorAll("audio").forEach(audio => {
      audio.play().catch(() => {});
    });

    addSystemMessage("پخش صدا فعال شد.");
  }

  function leaveRoom() {
    if (isHost) {
      broadcast({
        type: "system",
        message: "میزبان روم را ترک کرد."
      });
    } else if (hostConnection && hostConnection.open) {
      hostConnection.send({
        type: "leave"
      });
    }

    stopMicrophone();
    closeAllCalls();

    Object.values(connections).forEach(connection => {
      try {
        connection.close();
      } catch (e) {}
    });

    if (peer) {
      try {
        peer.destroy();
      } catch (e) {}
    }

    location.reload();
  }
</script>

</body>
  </html>
