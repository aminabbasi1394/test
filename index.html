<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>روم آنلاین صوتی و متنی</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #17191f;
      color: white;
      font-family: Tahoma, Arial, sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .box {
      width: 100%;
      padding: 20px;
      border-radius: 18px;
      background: #22252d;
      box-shadow: 0 10px 30px #0004;
    }

    h1 {
      margin: 0 0 25px;
      text-align: center;
      font-size: 23px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      outline: none;
      border: 1px solid #3c414d;
      border-radius: 10px;
      background: #17191f;
      color: white;
      font-size: 14px;
    }

    .main-btn,
    .send-btn,
    .voice-btn {
      border: none;
      border-radius: 10px;
      background: #5865f2;
      color: white;
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      font-size: 15px;
    }

    #status {
      margin-top: 15px;
      color: #b9becb;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    #chat {
      display: none;
    }

    .room-title {
      margin-bottom: 10px;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .tab-group {
      flex: 1;
      min-width: 0;
    }

    .tab {
      width: 100%;
      padding: 13px 6px;
      border: none;
      border-radius: 11px;
      background: #2c303a;
      color: white;
      font-size: 13px;
    }

    .tab.active {
      border-radius: 11px 11px 0 0;
      background: #343946;
    }

    .panel {
      max-height: 0;
      padding: 0 12px;
      overflow: hidden;
      opacity: 0;
      border-radius: 0 0 11px 11px;
      background: #2c303a;
      transition: max-height .3s ease, padding .3s ease, opacity .25s ease;
    }

    .panel.open {
      max-height: 300px;
      padding: 12px;
      opacity: 1;
    }

    .player {
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: #20232b;
      font-size: 13px;
    }

    .console-line {
      margin-bottom: 8px;
      color: #c5cad5;
      font-size: 12px;
      line-height: 1.8;
    }

    #messages {
      height: 280px;
      padding: 12px;
      margin-top: 12px;
      overflow-y: auto;
      border-radius: 12px;
      background: #17191f;
    }

    .message {
      padding: 10px;
      margin-bottom: 9px;
      border-radius: 10px;
      background: #2c303a;
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .message-name {
      color: #8f9aff;
      font-weight: bold;
    }

    .system-message {
      margin: 10px 0;
      color: #9da5b7;
      text-align: center;
      font-size: 12px;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .chat-input input {
      flex: 1;
      min-width: 0;
      margin: 0;
    }

    .send-btn {
      width: 75px;
      font-size: 13px;
    }

    .voice-controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .voice-btn {
      flex: 1;
      padding: 13px 5px;
      font-size: 12px;
    }

    .voice-btn.off {
      background: #933d4b;
    }

    .room-code {
      margin-top: 12px;
      color: #aeb5c5;
      text-align: center;
      font-size: 12px;
    }

    .leave-btn {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #3b3035;
      color: #ff9da9;
    }

    #audioContainer {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div id="login" class="box">

      <h1>🎮 روم صوتی و متنی</h1>

      <input id="name" type="text" placeholder="نام شما" maxlength="20">

      <input id="room" type="text" placeholder="کد روم" maxlength="30">

      <button class="main-btn" onclick="createRoom()">
        ساخت روم
      </button>

      <button class="main-btn" onclick="joinRoom()">
        ورود به روم
      </button>

      <div id="status"></div>

    </div>


    <div id="chat" class="box">

      <div class="room-title">
        💬 روم آنلاین
      </div>


      <div class="tabs">

        <div class="tab-group">

          <button id="playersTab" class="tab"
            onclick="togglePanel('players')">
            👥 بازیکنان
          </button>

          <div id="playersPanel" class="panel">
            <div id="playersList"></div>
          </div>

        </div>


        <div class="tab-group">

          <button id="consoleTab" class="tab"
            onclick="togglePanel('console')">
            🖥️ کنسول
          </button>

          <div id="consolePanel" class="panel">
            <div id="consoleLog"></div>
          </div>

        </div>

      </div>


      <div id="messages"></div>


      <div class="chat-input">

        <input id="message"
          type="text"
          placeholder="پیامت رو بنویس..."
          maxlength="500"
          onkeydown="handleEnter(event)">

        <button class="send-btn" onclick="sendMessage()">
          ارسال
        </button>

      </div>


      <div class="voice-controls">

        <button id="micButton"
          class="voice-btn"
          onclick="toggleMicrophone()">
          🎤 روشن کردن میکروفون
        </button>

        <button class="voice-btn" onclick="stopMicrophone()">
          🔇 قطع صدا
        </button>

      </div>


      <div id="roomCodeText" class="room-code"></div>

      <button class="leave-btn" onclick="leaveRoom()">
        خروج از روم
      </button>

    </div>

  </div>


  <div id="audioContainer"></div>


  <script>
    const MAX_PLAYERS = 5;

    let peer = null;
    let myName = "";
    let roomID = "";
    let isHost = false;

    let players = {};
    let connections = [];
    let activePanel = null;

    let localStream = null;
    let calls = {};
    let micEnabled = false;


    function setStatus(text) {
      document.getElementById("status").innerText = text;
    }


    function createRoom() {

      myName = document.getElementById("name").value.trim();
      const code = document.getElementById("room").value.trim();

      if (!myName || !code) {
        setStatus("لطفاً نام و کد روم را وارد کن");
        return;
      }

      roomID = "room-" + code;
      isHost = true;
      connections = [];

      peer = new Peer(roomID);

      peer.on("open", () => {

        players[peer.id] = {
          name: myName,
          host: true
        };

        showChat();

        logConsole("✅ روم ساخته شد");
        logConsole("👑 شما میزبان هستید");

        updatePlayers();

      });


      peer.on("connection", connection => {

        connections.push(connection);

        connection.on("open", () => {

          connection.on("data", data => {
            handleHostData(connection, data);
          });

        });

      });


      peer.on("call", call => {

        if (!localStream) {
          call.answer();
        } else {
          call.answer(localStream);
        }

        call.on("stream", stream => {
          playAudio(call.peer, stream);
        });

        calls[call.peer] = call;

      });


      peer.on("error", error => {
        console.log(error);
        setStatus("خطا در ساخت روم؛ ممکن است کد تکراری باشد");
      });

    }


    function joinRoom() {

      myName = document.getElementById("name").value.trim();
      const code = document.getElementById("room").value.trim();

      if (!myName || !code) {
        setStatus("لطفاً نام و کد روم را وارد کن");
        return;
      }

      roomID = "room-" + code;
      isHost = false;

      peer = new Peer();

      peer.on("open", () => {

        const connection = peer.connect(roomID);

        connections.push(connection);

        connection.on("open", () => {

          connection.send({
            type: "join",
            name: myName,
            peerID: peer.id
          });

          showChat();

          logConsole("🔄 درخواست ورود ارسال شد");

        });

        connection.on("data", handleGuestData);

      });


      peer.on("call", call => {

        call.answer(localStream || undefined);

        call.on("stream", stream => {
          playAudio(call.peer, stream);
        });

        calls[call.peer] = call;

      });


      peer.on("error", error => {
        console.log(error);
        setStatus("روم پیدا نشد یا اتصال مشکل دارد");
      });

    }


    function handleHostData(connection, data) {

      if (data.type === "join") {

        if (Object.keys(players).length >= MAX_PLAYERS) {

          connection.send({
            type: "system",
            message: "❌ روم پر است"
          });

          return;
        }

        players[data.peerID] = {
          name: data.name,
          host: false
        };

        logConsole("👤 " + data.name + " وارد روم شد");

        broadcast({
          type: "players",
          players: players
        });

        broadcast({
          type: "system",
          message: data.name + " وارد روم شد"
        });

        updatePlayers();

        // ارسال شناسه تمام بازیکنان برای اتصال صوتی
        broadcast({
          type: "voicePeers",
          peers: Object.keys(players)
        });

        connection.send({
          type: "voicePeers",
          peers: Object.keys(players)
        });

      }


      if (data.type === "message") {

        addMessage(data.name, data.message);
        broadcast(data);

      }

    }


    function handleGuestData(data) {

      if (data.type === "players") {

        players = data.players;
        updatePlayers();

      }

      if (data.type === "message") {
        addMessage(data.name, data.message);
      }

      if (data.type === "system") {

        addSystemMessage(data.message);
        logConsole(data.message);

      }

      if (data.type === "voicePeers") {

        data.peers.forEach(id => {

          if (id !== peer.id && !calls[id]) {
            startCall(id);
          }

        });

      }

    }


    function broadcast(data) {

      connections.forEach(connection => {

        if (connection.open) {
          connection.send(data);
        }

      });

    }


    function showChat() {

      document.getElementById("login").style.display = "none";
      document.getElementById("chat").style.display = "block";

      document.getElementById("roomCodeText").innerText =
        "کد روم: " + roomID.replace("room-", "");

      addSystemMessage("به روم خوش آمدی 🎮");

    }


    function togglePanel(panel) {

      const playersPanel = document.getElementById("playersPanel");
      const consolePanel = document.getElementById("consolePanel");

      const playersTab = document.getElementById("playersTab");
      const consoleTab = document.getElementById("consoleTab");

      playersPanel.classList.remove("open");
      consolePanel.classList.remove("open");

      playersTab.classList.remove("active");
      consoleTab.classList.remove("active");

      if (activePanel === panel) {

        activePanel = null;
        return;

      }

      if (panel === "players") {

        playersPanel.classList.add("open");
        playersTab.classList.add("active");

      }

      if (panel === "console") {

        consolePanel.classList.add("open");
        consoleTab.classList.add("active");

      }

      activePanel = panel;

    }


    function updatePlayers() {

      const list = document.getElementById("playersList");

      list.innerHTML = "";

      Object.values(players).forEach(player => {

        const div = document.createElement("div");

        div.className = "player";

        div.innerText =
          (player.host ? "👑 " : "👤 ") + player.name;

        list.appendChild(div);

      });

    }


    function logConsole(message) {

      const log = document.getElementById("consoleLog");

      const line = document.createElement("div");

      line.className = "console-line";

      line.innerText =
        "[" + new Date().toLocaleTimeString("fa-IR") + "] " + message;

      log.appendChild(line);
      log.scrollTop = log.scrollHeight;

    }


    function addSystemMessage(message) {

      const messages = document.getElementById("messages");

      const div = document.createElement("div");

      div.className = "system-message";
      div.innerText = message;

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;

    }


    function addMessage(name, message) {

      const messages = document.getElementById("messages");

      const div = document.createElement("div");
      div.className = "message";

      const nameDiv = document.createElement("div");
      nameDiv.className = "message-name";
      nameDiv.innerText = name;

      const textDiv = document.createElement("div");
      textDiv.innerText = message;

      div.appendChild(nameDiv);
      div.appendChild(textDiv);

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;

    }


    function sendMessage() {

      const input = document.getElementById("message");
      const message = input.value.trim();

      if (!message) return;

      const data = {
        type: "message",
        name: myName,
        message: message
      };

      addMessage(myName, message);

      if (isHost) {

        broadcast(data);

      } else {

        const connection = connections[0];

        if (connection && connection.open) {
          connection.send(data);
        }

      }

      input.value = "";

    }


    function handleEnter(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    }


    // فعال کردن میکروفون
    async function toggleMicrophone() {

      if (micEnabled) {

        stopMicrophone();
        return;

      }

      try {

        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: false
        });

        micEnabled = true;

        const button = document.getElementById("micButton");

        button.innerText = "🔴 خاموش کردن میکروفون";
        button.classList.add("off");

        logConsole("🎤 میکروفون روشن شد");

        // برقراری تماس با بازیکنان موجود
        Object.keys(players).forEach(id => {

          if (id !== peer.id) {
            startCall(id);
          }

        });

      } catch (error) {

        console.log(error);

        alert("اجازه دسترسی به میکروفون داده نشد");

      }

    }


    // برقراری تماس صوتی
    function startCall(targetID) {

      if (!peer || !localStream || calls[targetID]) {
        return;
      }

      const call = peer.call(targetID, localStream);

      calls[targetID] = call;

      call.on("stream", stream => {
        playAudio(targetID, stream);
      });

      call.on("close", () => {
        delete calls[targetID];
      });

    }


    // پخش صدای بازیکن
    function playAudio(id, stream) {

      let audio = document.getElementById("audio-" + id);

      if (!audio) {

        audio = document.createElement("audio");

        audio.id = "audio-" + id;
        audio.autoplay = true;
        audio.controls = false;

        document.getElementById("audioContainer").appendChild(audio);

      }

      audio.srcObject = stream;

    }


    // خاموش کردن میکروفون
    function stopMicrophone() {

      if (localStream) {

        localStream.getTracks().forEach(track => {
          track.stop();
        });

        localStream = null;

      }

      micEnabled = false;

      const button = document.getElementById("micButton");

      button.innerText = "🎤 روشن کردن میکروفون";
      button.classList.remove("off");

      logConsole("🔇 میکروفون خاموش شد");

    }


    function leaveRoom() {

      stopMicrophone();

      Object.values(calls).forEach(call => {
        call.close();
      });

      calls = {};

      if (peer) {
        peer.destroy();
      }

      peer = null;
      players = {};
      connections = [];
      activePanel = null;

      document.getElementById("room").value = "";
      document.getElementById("roomCodeText").innerText = "";

      document.getElementById("chat").style.display = "none";
      document.getElementById("login").style.display = "block";

      document.getElementById("messages").innerHTML = "";
      document.getElementById("consoleLog").innerHTML = "";
      document.getElementById("playersList").innerHTML = "";

      setStatus("از روم خارج شدی");

    }
  </script>

</body>
</html>
